<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seguridad Integral Corporativa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eceef0;
      --panel: #ffffff;
      --text-main: #303846;
      --text-muted: #6b7280;
      --title-blue: #2f80ed;
      --shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
      --shadow-hover: 0 12px 22px rgba(15, 23, 42, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text-main);
    }

    .dashboard {
      max-width: 1160px;
      margin: 0 auto;
      padding: 22px 22px 34px;
    }

    .top-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: start;
      column-gap: 16px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-logo {
      width: 96px;
      height: 96px;
      flex: 0 0 auto;
    }

    .brand-title {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px;
      font-size: clamp(30px, 4.1vw, 46px);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.05;
      margin-top: -2px;
      user-select: none;
    }

    .brand-title .blue {
      color: var(--title-blue);
    }

    .brand-title .gray {
      color: #666;
    }

    .theme-btn {
      margin-top: 4px;
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 1px solid #dde3ea;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .theme-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.12);
    }

    .modules-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(170px, 1fr));
      gap: 14px 16px;
      padding-top: 10px;
    }

    .module-card {
      position: relative;
      border: 1px solid #d8dee8;
      border-radius: 12px;
      overflow: hidden;
      background: var(--panel);
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
      min-height: 164px;
    }

    .module-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: var(--accent, #2f80ed);
      z-index: 2;
    }

    .module-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }

    .module-image-wrap {
      width: 100%;
      height: 104px;
      overflow: hidden;
      background: #dbe4ef;
    }

    .module-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .module-card:hover .module-image {
      transform: scale(1.04);
    }

    .module-label {
      min-height: 58px;
      display: grid;
      place-items: center;
      text-align: center;
      font-size: 13.3px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: 0.01em;
      text-transform: uppercase;
      color: #2d3645;
      padding: 8px 9px 10px;
      background: #fff;
    }

    body.dark {
      --bg: radial-gradient(circle at 20% -20%, #23324a 0%, #111827 56%, #0f172a 100%);
      --panel: #182236;
      --text-main: #e2e8f0;
      --text-muted: #b8c1cd;
    }

    body.dark .module-card {
      border-color: #23324b;
    }

    body.dark .module-label {
      background: #182236;
      color: #e6ecf8;
    }

    body.dark .brand-title .gray {
      color: #d0d7e2;
    }

    body.dark .theme-btn {
      background: #19263a;
      border-color: #334155;
      color: #f1f5f9;
    }

    @media (max-width: 1024px) {
      .modules-grid {
        grid-template-columns: repeat(3, minmax(170px, 1fr));
      }
    }

    @media (max-width: 760px) {
      .top-row {
        grid-template-columns: 1fr;
        row-gap: 10px;
      }

      .theme-btn {
        justify-self: end;
      }

      .modules-grid {
        grid-template-columns: repeat(2, minmax(150px, 1fr));
      }

      .brand-logo {
        width: 72px;
        height: 72px;
      }
    }

    @media (max-width: 460px) {
      .modules-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="dashboard">
    <section class="top-row">
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#a1a1aa"></stop>
              <stop offset="100%" stop-color="#7b8494"></stop>
            </linearGradient>
          </defs>
          <path d="M60 8L95 21V50C95 72 80 92 60 106C40 92 25 72 25 50V21L60 8Z" fill="none" stroke="url(#shieldGrad)" stroke-width="4.4" />
          <path d="M60 22L81 30V48C81 62 71 76 60 84C49 76 39 62 39 48V30L60 22Z" fill="none" stroke="#8d96a5" stroke-width="3.6" />
          <circle cx="60" cy="54" r="11" fill="#1791e8"></circle>
          <path d="M54 54.5L58.4 59L66.2 50.8" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path>
          <circle cx="18" cy="25" r="3.2" fill="#8d96a5"></circle>
          <circle cx="102" cy="25" r="3.2" fill="#8d96a5"></circle>
          <circle cx="20" cy="76" r="3.2" fill="#8d96a5"></circle>
          <circle cx="100" cy="76" r="3.2" fill="#8d96a5"></circle>
          <path d="M21 25H40M80 25H99M22 76H38M82 76H98" stroke="#8d96a5" stroke-width="2.4" stroke-linecap="round"></path>
          <path d="M60 5V15" stroke="#8d96a5" stroke-width="2.2" stroke-linecap="round"></path>
        </svg>

        <h1 class="brand-title">
          <span class="blue">Seguridad</span>
          <span class="gray">Integral</span>
          <span class="gray">Corporativa</span>
        </h1>
      </div>

      <button id="themeBtn" class="theme-btn" title="Cambiar tema" aria-label="Cambiar tema">
        🌙
      </button>
    </section>

    <section id="modulesGrid" class="modules-grid" aria-label="Módulos"></section>
  </main>

  <script>
    const MODULES = [
      {
        title: "ASEGURAMIENTO\nDE INGRESOS",
        accent: "#2ea36a",
        image: "https://images.unsplash.com/photo-1642790551116-18e150f2482f?auto=format&fit=crop&w=900&q=80"
      },
      {
        title: "PREVENCION\nDE FRAUDE",
        accent: "#7c4dff",
        image: "https://images.unsplash.com/photo-1556740749-887f6717d7e4?auto=format&fit=crop&w=900&q=80"
      },
      {
        title: "SEGURIDAD\nCIBERNETICA",
        accent: "#0f4f9f",
        image: "https://images.unsplash.com/photo-1563986768609-322da13575f3?auto=format&fit=crop&w=900&q=80"
      },
      {
        title: "OPERACIONES DE\nSEGURIDAD",
        accent: "#c15f36",
        image: "https://images.unsplash.com/photo-1614064641938-3bbee52942c7?auto=format&fit=crop&w=900&q=80"
      },
      {
        title: "SEGURIDAD HUMANA\nY PATRIMONIAL",
        accent: "#e2804e",
        image: "https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=900&q=80"
      },
      {
        title: "SOIE",
        accent: "#2f80ed",
        image: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=900&q=80"
      },
      {
        title: "EVOLUC GESTION\nDE RIESGOS SICORP",
        accent: "#17a2a4",
        image: "https://images.unsplash.com/photo-1633265486501-0cf524a072f8?auto=format&fit=crop&w=900&q=80"
      },
      {
        title: "PROYECTOS &\nPRESUPUESTOS SIC",
        accent: "#d19a24",
        image: "https://images.unsplash.com/photo-1556742031-c6961e8560b0?auto=format&fit=crop&w=900&q=80"
      }
    ];

    const grid = document.getElementById("modulesGrid");
    const themeBtn = document.getElementById("themeBtn");

    function renderModules() {
      grid.innerHTML = "";
      MODULES.forEach((module) => {
        const card = document.createElement("article");
        card.className = "module-card";
        card.style.setProperty("--accent", module.accent);

        card.innerHTML = `
          <div class="module-image-wrap">
            <img class="module-image" src="${module.image}" alt="${module.title.replace(/\n/g, " ")}" loading="lazy">
          </div>
          <div class="module-label">${module.title.replace(/\n/g, "<br>")}</div>
        `;

        grid.appendChild(card);
      });
    }

    themeBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      themeBtn.textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";
    });

    renderModules();
  </script>
</body>
</html>
